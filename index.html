<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صالة العرض الفاخرة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07070a;--gold:#c9a24b;--tx:#f3ede0;--mut:#a9a193;--pn:rgba(16,15,20,.72);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07070a}}
:root[data-theme="dark"]{--bg:#07070a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 12px)}
button{font:inherit;color:var(--tx);pointer-events:auto;cursor:pointer}
.brand{font-size:22px;font-weight:700;color:var(--gold);letter-spacing:.02em}
.sub{font-size:13px;color:var(--mut)}
#tabs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pill{background:var(--pn);border:1px solid rgba(201,162,75,.35);border-radius:999px;padding:7px 14px;font-size:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap}
.pill.on{background:var(--gold);color:#17130a;border-color:var(--gold);font-weight:600}
#title{margin-top:10px;font-size:14px;color:var(--mut)}#title b{color:var(--tx);font-size:17px;margin-inline-end:8px}
#card{pointer-events:auto;background:var(--pn);border:1px solid rgba(201,162,75,.4);border-radius:16px;padding:12px 40px 12px 14px;margin-bottom:10px;position:relative;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#card h3{margin:0 0 4px;font-size:16px;color:var(--gold)}#card p{margin:0;font-size:14px;line-height:1.7}
#cx{position:absolute;top:8px;inset-inline-end:10px;background:none;border:0;font-size:16px;color:var(--mut)}
#card[hidden]{display:none}
#chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;pointer-events:auto;scrollbar-width:none}
#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#sw{display:flex;gap:8px;margin-inline-start:auto}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.25);padding:0}.sw.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--gold)}
#dots{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.dot{position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:2px solid var(--gold);background:rgba(201,162,75,.25);padding:0;font-size:12px;line-height:1;animation:pu 2s infinite}
.dot.on{background:var(--gold);animation:none}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(201,162,75,.6)}100%{box-shadow:0 0 0 14px rgba(201,162,75,0)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#top{display:flex;justify-content:space-between;align-items:center}
.brand{font-size:15px;opacity:.85}.brand b{font-size:13px;color:var(--mut);font-weight:400;margin-inline-start:8px}
#panel{pointer-events:auto;background:var(--pn);border:1px solid rgba(201,162,75,.3);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#panel[hidden]{display:none}#tabs{margin:0}#chips{padding-bottom:0}
.dot{width:18px;height:18px;margin:-9px 0 0 -9px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dots"></div>
<div id="ui">
  <div id="top">
    <div class="brand">صالة العرض<b id="mn"></b><span id="mt" hidden></span></div><button class="pill" id="mb" aria-expanded="false">القائمة</button>
    
    
    
  </div>
  <div id="bot">
    <div id="card" hidden><h3 id="ct"></h3><p id="cp"></p><button id="cx" aria-label="إغلاق">✕</button></div>
    <div id="panel" hidden><div id="tabs"></div><div id="chips"></div>
    <div id="ctl">
      <button class="pill" id="bd">فتح الأبواب</button>
      <button class="pill" id="bl">الأضواء</button>
      <button class="pill on" id="br">دوران تلقائي</button>
      <button class="pill" id="bg">نموذج GLB</button><input type="file" id="gf" accept=".glb" hidden><span id="sw"></span><div style="font-size:11px;color:var(--mut);width:100%">المجسم: Car Concept — Eric Chadwick / Khronos Group (CC BY 4.0)</div>
    </div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const $=s=>document.querySelector(s);
const M={
 sedan:{n:'سيدان فاخرة',t:'أناقة هادئة وقيادة راقية',L:4.8,h:.88,ch:1.42,c0:-1.45,c1:-.95,c2:.25,c3:.8,doors:[[.65,.95],[-.33,.95]],rows:2,r:.36},
 suv:{n:'SUV عائلية',t:'مساحة رحبة وحضور قوي',L:4.7,h:1.02,ch:1.72,c0:-2.0,c1:-1.85,c2:.55,c3:1.05,doors:[[.9,1],[-.12,1.35]],rows:2,r:.42},
 coupe:{n:'كوبيه رياضية',t:'خطوط حادة وأداء مثير',L:4.5,h:.82,ch:1.25,c0:-1.1,c1:-.55,c2:.1,c3:.65,doors:[[.55,1.2]],rows:1,r:.37}
};
const T=[
['رادار القيادة الذكية','يراقب الطريق أمامك ويحافظ على المسافة الآمنة، ويكبح تلقائياً عند الخطر.'],
['كاميرا 360°','عرض علوي كامل حول السيارة لركن أسهل ومناورات آمنة في المساحات الضيقة.'],
['شاشة ولوحة رقمية','شاشة لمس عالية الدقة مع الملاحة والتحكم الصوتي والاتصال اللاسلكي بالهاتف.'],
['مصابيح LED ذكية','تكيّف الإضاءة مع الطريق وتخفف الوهج عن السيارات المقابلة تلقائياً.'],
['محرك هجين كهربائي','يجمع قوة الأداء مع توفير الوقود وانسيابية القيادة الكهربائية.'],
['حساسات الركن الخلفية','تنبيه صوتي وبصري للعوائق أثناء الرجوع للخلف.']
];
const COLORS=['#a8112a','#12304f','#d6d6da','#1a1a1f','#b8923f'];
const tpos=p=>[[p.L/2+.1,.55,0],[(p.c1+p.c2)/2,p.ch+.12,0],[p.c3-.38,p.h+.28,0],[p.L/2+.1,.66,.6],[(p.L/2+p.c3)/2,p.h,0],[-p.L/2-.1,.6,0]].map(a=>new THREE.Vector3(...a));
const tview=p=>[
 {az:1.2,ph:.15,d:4,t:[p.L/2,.6,0]},{az:.7,ph:.6,d:5,t:[0,1.2,0]},{az:.35,ph:.85,d:3.3,t:[p.c3-.3,1,0]},
 {az:1,ph:.1,d:3.6,t:[p.L/2,.7,.3]},{az:.9,ph:.5,d:4.6,t:[p.c3+.3,.9,0]},{az:-1.3,ph:.2,d:4,t:[-p.L/2,.6,0]}];
const topY=(p,x)=>{if(x<=p.c0||x>=p.c3)return p.h;if(x<p.c1)return p.h+(p.ch-p.h)*(x-p.c0)/(p.c1-p.c0);if(x<=p.c2)return p.ch;return p.ch-(p.ch-p.h)*(x-p.c2)/(p.c3-p.c2)};

const R=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.1;R.outputEncoding=THREE.sRGBEncoding;
const S=new THREE.Scene();S.background=new THREE.Color(0x060608);S.fog=new THREE.Fog(0x060608,24,70);
const cam=new THREE.PerspectiveCamera(38,1,.1,100);

// reflections environment
(()=>{const c=document.createElement('canvas');c.width=1024;c.height=512;const x=c.getContext('2d');
const g=x.createLinearGradient(0,0,0,512);g.addColorStop(0,'#2a2a32');g.addColorStop(.55,'#0b0b0f');g.addColorStop(1,'#030304');x.fillStyle=g;x.fillRect(0,0,1024,512);
[[60,'#fff'],[260,'#ffe6b0'],[480,'#fff'],[700,'#ffd98a'],[900,'#cfe0ff']].forEach(([px,col])=>{x.fillStyle=col;x.fillRect(px,90,110,70)});
const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.encoding=THREE.sRGBEncoding;
S.environment=new THREE.PMREMGenerator(R).fromEquirectangular(t).texture})();

// stage
const floor=new THREE.Mesh(new THREE.CircleGeometry(40,64),new THREE.MeshStandardMaterial({color:0x0d0d11,metalness:.85,roughness:.3}));floor.rotation.x=-Math.PI/2;floor.position.y=-.09;S.add(floor);
const plate=new THREE.Mesh(new THREE.CylinderGeometry(3.7,3.8,.09,72),new THREE.MeshStandardMaterial({color:0x15141a,metalness:.9,roughness:.25}));plate.position.y=-.045;S.add(plate);
const ring=new THREE.Mesh(new THREE.RingGeometry(3.5,3.62,72),new THREE.MeshBasicMaterial({color:0xc9a24b,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.005;S.add(ring);
for(let i=0;i<28;i++){const a=i/28*Math.PI*2,b=new THREE.Mesh(new THREE.BoxGeometry(.25,14,.25),new THREE.MeshBasicMaterial({color:i%2?0x6b5420:0xc9a24b}));b.position.set(Math.cos(a)*24,6,Math.sin(a)*24);S.add(b)}
const bc=document.createElement('canvas');bc.width=bc.height=128;{const x=bc.getContext('2d'),g=x.createRadialGradient(64,64,4,64,64,64);g.addColorStop(0,'rgba(0,0,0,.85)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,128,128)}
const blob=new THREE.Mesh(new THREE.PlaneGeometry(7,3.6),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(bc),transparent:true,depthWrite:false}));blob.rotation.x=-Math.PI/2;blob.position.y=.012;S.add(blob);
S.add(new THREE.HemisphereLight(0x8890a8,0x111114,.35));
const k=new THREE.SpotLight(0xfff0d0,1.6,40,.5,.6);k.position.set(5,10,6);S.add(k);
const rl=new THREE.SpotLight(0x88aaff,1.1,40,.6,.6);rl.position.set(-7,6,-6);S.add(rl);

// car
const paint=new THREE.MeshPhysicalMaterial({color:COLORS[0],metalness:.7,roughness:.28,clearcoat:1,clearcoatRoughness:.05});
const glass=new THREE.MeshPhysicalMaterial({color:0x0a1018,metalness:.9,roughness:.05,transparent:true,opacity:.5,depthWrite:false});
const dark=new THREE.MeshStandardMaterial({color:0x0c0c0f,roughness:.7});
const leather=new THREE.MeshStandardMaterial({color:0xb08a5a,roughness:.6});
const headM=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xfff2cc,emissiveIntensity:2});
const tailM=new THREE.MeshStandardMaterial({color:0x550000,emissive:0xff1a1a,emissiveIntensity:1.5});
const screenM=new THREE.MeshStandardMaterial({color:0x06121f,emissive:0x3aa0ff,emissiveIntensity:1.4});
const chrome=new THREE.MeshStandardMaterial({color:0xdadade,metalness:1,roughness:.2});
let car,doors=[],cur='sedan',lightsOn=true;
const ext=(sh,d,bev)=>{const g=new THREE.ExtrudeGeometry(sh,bev?{depth:d,bevelEnabled:true,bevelThickness:.08,bevelSize:.08,bevelSegments:3}:{depth:d,bevelEnabled:false});g.translate(0,0,-d/2);return g};
const poly=pts=>{const s=new THREE.Shape();pts.forEach((q,i)=>i?s.lineTo(q[0],q[1]):s.moveTo(q[0],q[1]));return s};
const add=(g,geo,m,x,y,z)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);g.add(o);return o};

function build(key){
 if(car)S.remove(car);if(real){S.remove(real);real=null}doors=[];
 const p=M[key],L=p.L,h=p.h,Wc=1.6,g=new THREE.Group();
 g.add(new THREE.Mesh(ext(poly([[-L/2,.34],[L/2,.34],[L/2,.62],[L/2-.35,h-.06],[p.c3,h],[p.c0,h],[-L/2+.3,h],[-L/2,.72]]),Wc,true),paint));
 g.add(new THREE.Mesh(ext(poly([[p.c0,h],[p.c1,p.ch],[p.c2,p.ch],[p.c3,h]]),Wc-.25),glass));
 add(g,new THREE.BoxGeometry(p.c2-p.c1+.08,.05,Wc-.2),paint,(p.c1+p.c2)/2,p.ch+.015,0);
 // interior
 add(g,new THREE.BoxGeometry(p.c3-p.c0-.3,.02,Wc-.3),dark,(p.c0+p.c3)/2,h+.01,0);
 const rows=[p.c3-.9].concat(p.rows>1?[p.c0+.65]:[]);
 rows.forEach(x=>[-.4,.4].forEach(z=>{add(g,new THREE.BoxGeometry(.55,.12,.5),leather,x,h+.08,z);const b=add(g,new THREE.BoxGeometry(.1,.55,.5),leather,x-.3,h+.36,z);b.rotation.z=.15}));
 add(g,new THREE.BoxGeometry(.35,.2,Wc-.3),dark,p.c3-.2,h+.12,0);
 add(g,new THREE.BoxGeometry(.02,.17,.32),screenM,p.c3-.39,h+.28,0);
 const sw=add(g,new THREE.TorusGeometry(.15,.022,8,24),dark,p.c3-.62,h+.3,.4);sw.rotation.y=Math.PI/2;sw.rotation.z=.4;
 // lights & mirrors
 [-.6,.6].forEach(z=>{add(g,new THREE.BoxGeometry(.06,.12,.4),headM,L/2+.09,.66,z);add(g,new THREE.BoxGeometry(.06,.1,.4),tailM,-L/2-.09,.72,z);add(g,new THREE.BoxGeometry(.18,.1,.12),paint,p.c3-.1,h+.14,z*1.5)});
 add(g,new THREE.BoxGeometry(.05,.14,.9),dark,L/2+.09,.5,0);
 // wheels
 [[1,1],[1,-1],[-1,1],[-1,-1]].forEach(([a,b])=>{const w=new THREE.Group();w.add(new THREE.Mesh(new THREE.CylinderGeometry(p.r,p.r,.28,32),dark),new THREE.Mesh(new THREE.CylinderGeometry(p.r*.62,p.r*.62,.3,24),chrome));w.rotation.x=Math.PI/2;w.position.set(a*(L/2-.85),p.r,b*.84);g.add(w)});
 // doors
 p.doors.forEach(([hx,len])=>[1,-1].forEach(side=>{
  const d=new THREE.Group();d.position.set(hx,0,side*.91);d.userData={open:0,target:0,side};
  add(d,new THREE.BoxGeometry(len,h-.4,.1),paint,-len/2,(h+.4)/2,0);
  const xa=hx-len,pts=[[-len,h],[0,h],[0,topY(p,hx)-h+h]];
  [p.c2,p.c1].forEach(c=>{if(c<hx&&c>xa)pts.push([c-hx,p.ch])});
  pts.push([-len,topY(p,xa)]);
  const gm=new THREE.Mesh(ext(poly(pts),.04),glass);d.add(gm);
  add(d,new THREE.BoxGeometry(.2,.04,.05),chrome,-len+.25,h-.12,.07);
  d.children.forEach(m=>m.userData.door=d);g.add(d);doors.push(d)}));
 car=g;S.add(g);setLights(lightsOn);
 dots.forEach(x=>x.remove());dots=[];tp=tpos(p);
 tp.forEach((v,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label',T[i][0]);b.onclick=()=>pick(i);$('#dots').appendChild(b);dots.push(b)});
 $('#mn').textContent=p.n;$('#mt').textContent=p.t;$('#bd').textContent='فتح الأبواب';$('#chips').style.display='';
}
let dots=[],tp=[],act=-1;
function setLights(on){lightsOn=on;headM.emissiveIntensity=on?2:.05;tailM.emissiveIntensity=on?1.5:.1;$('#bl').classList.toggle('on',on)}

// camera state
const V={az:.6,ph:.2,d:7.5,t:new THREE.Vector3(0,.6,0)};let goal=null,auto=true,idle=0;
const home=()=>({az:V.az,ph:.2,d:7.5,t:[0,.6,0]});
const setGoal=o=>{goal={az:o.az,ph:o.ph,d:o.d,t:new THREE.Vector3(...o.t)}};
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

// pointer controls
const ptr=new Map();let down=null,pd=0;
const cv=$('#c');
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);down=[e.clientX,e.clientY,performance.now()];if(ptr.size==2)pd=pdist();goal=null;idle=performance.now();setPanel(false)});
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId);
 if(ptr.size==1){V.az-=(e.clientX-o[0])*.008;V.ph=Math.min(1.3,Math.max(.03,V.ph+(e.clientY-o[1])*.006))}
 ptr.set(e.pointerId,[e.clientX,e.clientY]);
 if(ptr.size==2){const n=pdist();V.d=Math.min(14,Math.max(2.5,V.d*pd/n));pd=n}idle=performance.now()});
const pdist=()=>{const a=[...ptr.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1};
cv.addEventListener('pointerup',e=>{ptr.delete(e.pointerId);
 if(down&&Math.hypot(e.clientX-down[0],e.clientY-down[1])<6&&performance.now()-down[2]<400)tap(e);down=null});
cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('wheel',e=>{e.preventDefault();V.d=Math.min(14,Math.max(2.5,V.d*(1+e.deltaY*.001)));goal=null},{passive:false});
const ray=new THREE.Raycaster();
function tap(e){ray.setFromCamera({x:e.clientX/innerWidth*2-1,y:-(e.clientY/innerHeight)*2+1},cam);
 const hit=ray.intersectObjects(doors.flatMap(d=>{const a=[];d.traverse(q=>a.push(q));return a}),false)[0];
 if(hit){const d=hit.object.userData.door;d.userData.target=d.userData.target?0:1;syncBtn()}}
function syncBtn(){$('#bd').textContent=doors.some(d=>d.userData.target)?'إغلاق الأبواب':'فتح الأبواب'}

// UI
Object.keys(M).forEach(k=>{const b=document.createElement('button');b.className='pill'+(k==cur?' on':'');b.textContent=M[k].n;b.onclick=()=>{cur=k;document.querySelectorAll('#tabs .pill').forEach(x=>x.classList.toggle('on',x===b));build(k);closeCard()};$('#tabs').appendChild(b)});
T.forEach((t,i)=>{const b=document.createElement('button');b.className='pill';b.textContent=t[0];b.onclick=()=>pick(i);$('#chips').appendChild(b)});
COLORS.forEach((c,i)=>{const b=document.createElement('button');b.className='sw'+(i?'':' on');b.style.background=c;b.setAttribute('aria-label','لون '+(i+1));b.onclick=()=>{paint.color.set(c);if(real)real.traverse(o=>{if(o.material&&/^Paint 1 Carmine/.test(o.material.name))o.material.color.set(c)});document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===b))};$('#sw').appendChild(b)});
function pick(i){act=i;$('#card').hidden=false;$('#ct').textContent=T[i][0];$('#cp').textContent=T[i][1];
 document.querySelectorAll('#chips .pill').forEach((x,j)=>x.classList.toggle('on',j==i));dots.forEach((x,j)=>x.classList.toggle('on',j==i));
 setGoal(tview(M[cur])[i]);auto=false;$('#br').classList.remove('on');setPanel(false)}
function closeCard(){act=-1;$('#card').hidden=true;document.querySelectorAll('#chips .pill').forEach(x=>x.classList.remove('on'));dots.forEach(x=>x.classList.remove('on'));setGoal(home())}
$('#cx').onclick=closeCard;
$('#bd').onclick=()=>{const o=!doors.some(d=>d.userData.target);doors.forEach(d=>d.userData.target=o?1:0);syncBtn()};
$('#bl').onclick=()=>setLights(!lightsOn);
$('#br').onclick=e=>{auto=!auto;e.currentTarget.classList.toggle('on',auto);if(auto)goal=null};

let pOpen=false;
function setPanel(o){pOpen=o;$('#panel').hidden=!o;$('#mb').textContent=o?'إخفاء':'القائمة';$('#mb').setAttribute('aria-expanded',o)}
$('#mb').onclick=()=>setPanel(!pOpen);
const gl=new THREE.GLTFLoader();let real=null;
$('#bg').onclick=()=>$('#gf').click();
$('#gf').onchange=e=>{const f=e.target.files[0];if(!f)return;f.arrayBuffer().then(ab=>gl.parse(ab,'',x=>{if(car)S.remove(car);if(real)S.remove(real);
  const m=x.scene,g2=new THREE.Group();g2.add(m);
  m.traverse(o=>{if(o.material&&/glass/i.test(o.material.name)){const q=o.material;q.transparent=true;q.opacity=.3;q.color.set(0x101820);q.roughness=.05;q.metalness=.9;q.depthWrite=false}});
  const bx=new THREE.Box3().setFromObject(m),sz=bx.getSize(new THREE.Vector3());
  m.scale.multiplyScalar(4.6/Math.max(sz.x,sz.z));if(sz.z>sz.x)g2.rotation.y=Math.PI/2;
  g2.updateMatrixWorld(true);bx.setFromObject(g2);const c=bx.getCenter(new THREE.Vector3());g2.position.set(-c.x,-bx.min.y,-c.z);
  doors=[];m.traverse(o=>{if(!/door/i.test(o.name)||/glass|window|handle|mirror/i.test(o.name)||doors.some(d=>d.getObjectById(o.id)))return;
   const w=new THREE.Vector3();o.getWorldPosition(w);o.userData={open:0,target:0,side:w.z>0?1:-1,base:o.rotation.z,ax:'z'};doors.push(o);o.traverse(q=>{q.userData.door=o})});
  real=g2;car=null;S.add(g2);dots.forEach(q=>q.remove());dots=[];tp=[];$('#chips').style.display='none';
  $('#card').hidden=true;act=-1;$('#mn').textContent=f.name;setGoal(home());syncBtn();setPanel(false)},er=>{console.error(er);$('#mn').textContent='تعذر قراءة الملف: '+(er&&er.message||er)}));e.target.value=''};
build(cur);
const tmp=new THREE.Vector3(),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;

 if(goal){const f=.07;V.az+=(goal.az-V.az)*f;V.ph+=(goal.ph-V.ph)*f;V.d+=(goal.d-V.d)*f;V.t.lerp(goal.t,f)}
 else{V.t.lerp(tmp.set(0,.6,0),act<0?.05:0);if(auto&&!RM&&performance.now()-idle>2500)V.az+=.004}

 doors.forEach(d=>{const u=d.userData;u.open+=(u.target-u.open)*.12;d.rotation[u.ax||'y']=(u.base||0)+u.side*u.open*.9});
 dots.forEach((b,i)=>{tmp.copy(tp[i]).project(cam);const vis=tmp.z<1&&Math.abs(tmp.x)<1.1&&Math.abs(tmp.y)<1.1;b.style.display=vis&&pOpen?'block':'none';b.style.transform=`translate(${(tmp.x*.5+.5)*innerWidth}px,${(-tmp.y*.5+.5)*innerHeight}px)`});
 R.render(S,cam)}
loop();
